<!DOCTYPE html>
<head>
<style>

path.link {
  fill: none;
}

path.link.similar {
  stroke: #999;
  stroke-width: 3px;
  stroke-dasharray: none;
}

path.link.notsimilar {
  stroke: #00aa00;
  stroke-width: 1.5px;
  stroke-dasharray: 5,5;
}

circle {
  stroke: #fff;
  stroke-width: 1.5px;
  cursor: pointer;
}

circle.pinned {
  stroke: #333;
  stroke-width: 2.5px;
  filter: brightness(0.7);
}

text {
  fill: #000;
  font: 10px sans-serif;
  pointer-events: none;
}

text.nodeLabel {
  font-weight: bold;
  font-size: 11px;
  text-anchor: start;
}

text#credit {
  font-size: 12px;
  font-weight: bold;
  fill: #333;
}

</style>
<meta charset="utf-8">
<title>Force-Directed Graph: Board Games</title>
</head>

<body>
<script type="text/javascript" src="../lib/d3.v5.min.js"></script>
<script>

d3.dsv(",", "board_games.csv", function(d) {
  return {
    source: d.source,
    target: d.target,
    value: +d.value
  }
}).then(function(data) {

  var links = data;

  var nodes = {};

  // compute the distinct nodes from the links.
  links.forEach(function(link) {
      link.source = nodes[link.source] || (nodes[link.source] = {name: link.source});
      link.target = nodes[link.target] || (nodes[link.target] = {name: link.target});
  });

  // Calculate node degrees for scaling
  var nodeArray = d3.values(nodes);
  var degrees = {};
  nodeArray.forEach(function(node) {
    degrees[node.name] = 0;
  });
  
  links.forEach(function(link) {
    degrees[link.source.name]++;
    degrees[link.target.name]++;
  });

  nodeArray.forEach(function(node) {
    node.degree = degrees[node.name];
  });

  // Get min and max degree for scaling
  var minDegree = d3.min(nodeArray, function(d) { return d.degree; });
  var maxDegree = d3.max(nodeArray, function(d) { return d.degree; });

  // Create scales
  var radiusScale = d3.scaleSqrt()
    .domain([minDegree, maxDegree])
    .range([8, 25]);

  var colorScale = d3.scaleLinear()
    .domain([minDegree, (minDegree + maxDegree) / 2, maxDegree])
    .range(["#ffffcc", "#fd9b3b", "#b10026"]);

  var width = 1200,
      height = 700;

  var svg = d3.select("body").append("svg")
      .attr("width", width)
      .attr("height", height);

  // Define tick function before force simulation
  var path, node, labels;
  
  function tick() {
      path.attr("d", function(d) {
          var dx = d.target.x - d.source.x,
              dy = d.target.y - d.source.y,
              dr = Math.sqrt(dx * dx + dy * dy);
          return "M" +
              d.source.x + "," +
              d.source.y + "A" +
              dr + "," + dr + " 0 0,1 " +
              d.target.x + "," +
              d.target.y;
      });

      node.attr("transform", function(d) {
          return "translate(" + d.x + "," + d.y + ")"; 
      });
  };

  //DO NOT MODIFY THE BELOW BLOCK OF CODE//
  var force = d3.forceSimulation()
      .nodes(d3.values(nodes))
      .force("link", d3.forceLink(links).distance(100))
      .force('center', d3.forceCenter(width / 2, height / 2))
      .force("x", d3.forceX())
      .force("y", d3.forceY())
      .force("charge", d3.forceManyBody().strength(-250))
      .alphaTarget(1)
      .on("tick", tick);
  //DO NOT MODIFY THE ABOVE BLOCK OF CODE//

  // add the links
  path = svg.append("g")
      .selectAll("path")
      .data(links)
      .enter()
      .append("path")
      .attr("class", function(d) { 
        return "link " + (d.value === 0 ? "similar" : "notsimilar"); 
      });

  // define the nodes
  node = svg.selectAll(".node")
      .data(force.nodes())
      .enter().append("g")
      .attr("class", "node")
      .call(d3.drag()
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended));

  // add the nodes and be sure to not have duplicate of this section
  node.append("circle")
      .attr("id", function(d){
         return (d.name.replace(/\s+/g,'').toLowerCase());
      })
      .attr("r", function(d) {
        return radiusScale(d.degree);
      })
      .attr("fill", function(d) {
        return colorScale(d.degree);
      })
      .on("dblclick", function(d) {
        d.fixed = false;
        d3.select(this).classed("pinned", false);
        // Restore original color by getting the degree-based color
        d3.select(this).attr("fill", function(d) {
          return colorScale(d.degree);
        });
      });

  // Add labels for nodes
  labels = node.append("text")
      .attr("class", "nodeLabel")
      .attr("dx", function(d) {
        return radiusScale(d.degree) + 3;
      })
      .attr("dy", function(d) {
        return -radiusScale(d.degree) + 3;
      })
      .style("font-size", "9px")
      .text(function(d) { return d.name; });

  function dragstarted(d) {
      if (!d3.event.active) force.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
      d.fixed = true;
      var circle = d3.select(this).select("circle");
      circle.classed("pinned", true);
      // Darken the color to show it's pinned
      var originalColor = colorScale(d.degree);
      circle.attr("fill", function() {
        return d3.rgb(originalColor).darker(1.5).toString();
      });
  };

  function dragged(d) {
      d.fx = d3.event.x;
      d.fy = d3.event.y;
  };

  function dragended(d) {
      if (!d3.event.active) force.alphaTarget(0);
      if (d.fixed == true) {
          d.fx = d.x;
          d.fy = d.y;
      }
      else {
          d.fx = null;
          d.fy = null;
      }
  };

  // Add GT username credit
  svg.append("text")
      .attr("id", "credit")
      .attr("x", width - 100)
      .attr("y", 20)
      .text("ctreadwell8");
  
}).catch(function(error) {
  console.log(error);
});

</script>
</body>
</html>
