<!DOCTYPE html>
<head>
  <meta charset="utf-8">
  <title>Q3: Line Charts</title>
  <script src="../lib/d3.v5.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f5f5f5;
    }
    svg {
      background-color: white;
      margin-bottom: 40px;
      display: block;
    }
    .axis {
      font-size: 12px;
    }
    .axis-label {
      font-size: 12px;
      font-weight: bold;
    }
    .line {
      fill: none;
      stroke-width: 2;
    }
    .line-label {
      font-size: 11px;
      font-weight: bold;
    }
    .rank-text {
      font-size: 9px;
      font-weight: bold;
      pointer-events: none;
    }
    .legend {
      font-size: 12px;
    }
    #signature {
      font-size: 14px;
      font-weight: bold;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <script>
    // Load CSV data
    d3.csv("boardgame_ratings.csv").then(function(rawData) {
      // Parse dates and convert values to numbers
      const parseDate = d3.timeParse("%Y-%m-%d");
      const data = rawData.map(d => ({
        date: parseDate(d.date),
        "Catan": +d["Catan=count"],
        "Catan_rank": +d["Catan=rank"],
        "Dominion": +d["Dominion=count"],
        "Dominion_rank": +d["Dominion=rank"],
        "Codenames": +d["Codenames=count"],
        "Codenames_rank": +d["Codenames=rank"],
        "Terraforming Mars": +d["Terraforming Mars=count"],
        "Terraforming Mars_rank": +d["Terraforming Mars=rank"],
        "Gloomhaven": +d["Gloomhaven=count"],
        "Gloomhaven_rank": +d["Gloomhaven=rank"],
        "Magic: The Gathering": +d["Magic: The Gathering=count"],
        "Magic: The Gathering_rank": +d["Magic: The Gathering=rank"],
        "Dixit": +d["Dixit=count"],
        "Dixit_rank": +d["Dixit=rank"],
        "Monopoly": +d["Monopoly=count"],
        "Monopoly_rank": +d["Monopoly=rank"]
      }));

      const games8 = ["Catan", "Dominion", "Codenames", "Terraforming Mars", "Gloomhaven", "Magic: The Gathering", "Dixit", "Monopoly"];
      const games4 = ["Catan", "Codenames", "Terraforming Mars", "Gloomhaven"];
      const colors = d3.schemeCategory10;

      // Margin convention
      const margin = { top: 20, right: 20, bottom: 60, left: 70 };
      const svgWidth = 1000;
      const svgHeight = 600;
      const width = svgWidth - margin.left - margin.right;
      const height = svgHeight - margin.top - margin.bottom;

      // Create chart functions and render charts
      renderChartA(games8, data, colors, margin, width, height);
      renderChartB(games4, data, colors, margin, width, height);
      renderChartC1(games4, data, colors, margin, width, height);
      renderChartC2(games4, data, colors, margin, width, height);

      // Set signature
      d3.select("#signature").text("gburdell3");
    });

    // ============ Q3.1: Basic Line Chart ============
    function renderChartA(games, data, colors, margin, width, height) {
      const svg = d3.select("body").append("svg")
        .attr("id", "svg-a")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom);

      // Title
      svg.append("text")
        .attr("id", "title-a")
        .attr("x", margin.left + width / 2)
        .attr("y", 15)
        .style("text-anchor", "middle")
        .style("font-size", "16px")
        .style("font-weight", "bold")
        .text("Number of Ratings 2016-2020");

      // Create plot group
      const plot = svg.append("g")
        .attr("id", "plot-a")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      // Create scales
      const xScale = d3.scaleTime()
        .domain(d3.extent(data, d => d.date))
        .range([0, width]);

      const yScale = d3.scaleLinear()
        .domain([0, d3.max(games, game => d3.max(data, d => d[game]))])
        .range([height, 0]);

      // Create line generator
      const line = d3.line()
        .x(d => xScale(d.date))
        .y(d => yScale(d.value));

      // Lines group
      const linesGroup = plot.append("g").attr("id", "lines-a");

      // Draw lines for each game
      games.forEach((game, idx) => {
        const gameData = data.map(d => ({ date: d.date, value: d[game] }));

        linesGroup.append("path")
          .datum(gameData)
          .attr("class", "line")
          .attr("d", line)
          .style("stroke", colors[idx % 10]);

        // Add line label at end
        const lastPoint = gameData[gameData.length - 1];
        linesGroup.append("text")
          .attr("class", "line-label")
          .attr("x", xScale(lastPoint.date) + 5)
          .attr("y", yScale(lastPoint.value) + 3)
          .style("fill", colors[idx % 10])
          .text(game);
      });

      // X-axis
      const xAxis = d3.axisBottom(xScale)
        .ticks(d3.timeMonth, 3)
        .tickFormat(d3.timeFormat("%b %y"));

      const xAxisGroup = plot.append("g")
        .attr("id", "x-axis-a")
        .attr("transform", `translate(0,${height})`)
        .call(xAxis);

      xAxisGroup.append("text")
        .attr("x", width / 2)
        .attr("y", 45)
        .style("fill", "black")
        .style("text-anchor", "middle")
        .style("font-size", "12px")
        .style("font-weight", "bold")
        .text("Month");

      // Y-axis
      const yAxis = d3.axisLeft(yScale);
      const yAxisGroup = plot.append("g")
        .attr("id", "y-axis-a")
        .call(yAxis);

      yAxisGroup.append("text")
        .attr("transform", "rotate(-90)")
        .attr("y", -50)
        .attr("x", -height / 2)
        .style("text-anchor", "middle")
        .style("font-size", "12px")
        .style("font-weight", "bold")
        .text("Num of Ratings");
    }

    // ============ Q3.2: With Rankings ============
    function renderChartB(games, data, colors, margin, width, height) {
      const svg = d3.select("body").append("svg")
        .attr("id", "svg-b")
        .attr("width", width + margin.left + margin.right + 120)
        .attr("height", height + margin.top + margin.bottom);

      // Title
      svg.append("text")
        .attr("id", "title-b")
        .attr("x", margin.left + width / 2)
        .attr("y", 15)
        .style("text-anchor", "middle")
        .style("font-size", "16px")
        .style("font-weight", "bold")
        .text("Number of Ratings 2016–2020 with Rankings");

      // Create plot group
      const plot = svg.append("g")
        .attr("id", "plot-b")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      // Create scales
      const xScale = d3.scaleTime()
        .domain(d3.extent(data, d => d.date))
        .range([0, width]);

      const yScale = d3.scaleLinear()
        .domain([0, d3.max(games, game => d3.max(data, d => d[game]))])
        .range([height, 0]);

      // Create line generator
      const line = d3.line()
        .x(d => xScale(d.date))
        .y(d => yScale(d.value));

      // Lines group
      const linesGroup = plot.append("g").attr("id", "lines-b");

      // Draw lines for each game
      games.forEach((game, idx) => {
        const gameData = data.map(d => ({ date: d.date, value: d[game] }));

        linesGroup.append("path")
          .datum(gameData)
          .attr("class", "line")
          .attr("d", line)
          .style("stroke", colors[idx % 10]);

        // Add line label at end
        const lastPoint = gameData[gameData.length - 1];
        linesGroup.append("text")
          .attr("class", "line-label")
          .attr("x", xScale(lastPoint.date) + 5)
          .attr("y", yScale(lastPoint.value) + 3)
          .style("fill", colors[idx % 10])
          .text(game);
      });

      // Symbols group
      const symbolsGroup = plot.append("g").attr("id", "symbols-b");

      // Add circle markers every 3 months
      const threeMonthlyData = data.filter((d, i) => i % 3 === 0);

      games.forEach((game, idx) => {
        threeMonthlyData.forEach(d => {
          const value = d[game];
          const rank = d[game + "_rank"];

          symbolsGroup.append("circle")
            .attr("cx", xScale(d.date))
            .attr("cy", yScale(value))
            .attr("r", 4)
            .style("fill", colors[idx % 10])
            .style("stroke", "white")
            .style("stroke-width", 1.5);

          symbolsGroup.append("text")
            .attr("class", "rank-text")
            .attr("x", xScale(d.date))
            .attr("y", yScale(value))
            .attr("text-anchor", "middle")
            .attr("dominant-baseline", "middle")
            .style("fill", "white")
            .text(rank);
        });
      });

      // X-axis
      const xAxis = d3.axisBottom(xScale)
        .ticks(d3.timeMonth, 3)
        .tickFormat(d3.timeFormat("%b %y"));

      const xAxisGroup = plot.append("g")
        .attr("id", "x-axis-b")
        .attr("transform", `translate(0,${height})`)
        .call(xAxis);

      xAxisGroup.append("text")
        .attr("x", width / 2)
        .attr("y", 45)
        .style("fill", "black")
        .style("text-anchor", "middle")
        .style("font-size", "12px")
        .style("font-weight", "bold")
        .text("Month");

      // Y-axis
      const yAxis = d3.axisLeft(yScale);
      const yAxisGroup = plot.append("g")
        .attr("id", "y-axis-b")
        .call(yAxis);

      yAxisGroup.append("text")
        .attr("transform", "rotate(-90)")
        .attr("y", -50)
        .attr("x", -height / 2)
        .style("text-anchor", "middle")
        .style("font-size", "12px")
        .style("font-weight", "bold")
        .text("Num of Ratings");

      // Legend
      const legendGroup = svg.append("g")
        .attr("id", "legend-b")
        .attr("transform", `translate(${margin.left + width + 40}, ${margin.top + 40})`);

      legendGroup.append("circle")
        .attr("cx", 0)
        .attr("cy", 0)
        .attr("r", 4)
        .style("fill", "#999")
        .style("stroke", "white")
        .style("stroke-width", 1.5);

      legendGroup.append("text")
        .attr("x", 15)
        .attr("y", 4)
        .style("font-size", "12px")
        .text("Ranking");
    }

    // ============ Q3.3-1: Square Root Scale ============
    function renderChartC1(games, data, colors, margin, width, height) {
      const svg = d3.select("body").append("svg")
        .attr("id", "svg-c-1")
        .attr("width", width + margin.left + margin.right + 120)
        .attr("height", height + margin.top + margin.bottom);

      // Title
      svg.append("text")
        .attr("id", "title-c-1")
        .attr("x", margin.left + width / 2)
        .attr("y", 15)
        .style("text-anchor", "middle")
        .style("font-size", "16px")
        .style("font-weight", "bold")
        .text("Number of Ratings 2016–2020 (Square root Scale)");

      // Create plot group
      const plot = svg.append("g")
        .attr("id", "plot-c-1")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      // Create scales
      const xScale = d3.scaleTime()
        .domain(d3.extent(data, d => d.date))
        .range([0, width]);

      const yScale = d3.scaleSqrt()
        .domain([0, d3.max(games, game => d3.max(data, d => d[game]))])
        .range([height, 0]);

      // Create line generator
      const line = d3.line()
        .x(d => xScale(d.date))
        .y(d => yScale(d.value));

      // Lines group
      const linesGroup = plot.append("g").attr("id", "lines-c-1");

      // Draw lines for each game
      games.forEach((game, idx) => {
        const gameData = data.map(d => ({ date: d.date, value: d[game] }));

        linesGroup.append("path")
          .datum(gameData)
          .attr("class", "line")
          .attr("d", line)
          .style("stroke", colors[idx % 10]);

        // Add line label at end
        const lastPoint = gameData[gameData.length - 1];
        linesGroup.append("text")
          .attr("class", "line-label")
          .attr("x", xScale(lastPoint.date) + 5)
          .attr("y", yScale(lastPoint.value) + 3)
          .style("fill", colors[idx % 10])
          .text(game);
      });

      // Symbols group
      const symbolsGroup = plot.append("g").attr("id", "symbols-c-1");

      // Add circle markers every 3 months
      const threeMonthlyData = data.filter((d, i) => i % 3 === 0);

      games.forEach((game, idx) => {
        threeMonthlyData.forEach(d => {
          const value = d[game];
          const rank = d[game + "_rank"];

          symbolsGroup.append("circle")
            .attr("cx", xScale(d.date))
            .attr("cy", yScale(value))
            .attr("r", 4)
            .style("fill", colors[idx % 10])
            .style("stroke", "white")
            .style("stroke-width", 1.5);

          symbolsGroup.append("text")
            .attr("class", "rank-text")
            .attr("x", xScale(d.date))
            .attr("y", yScale(value))
            .attr("text-anchor", "middle")
            .attr("dominant-baseline", "middle")
            .style("fill", "white")
            .text(rank);
        });
      });

      // X-axis
      const xAxis = d3.axisBottom(xScale)
        .ticks(d3.timeMonth, 3)
        .tickFormat(d3.timeFormat("%b %y"));

      const xAxisGroup = plot.append("g")
        .attr("id", "x-axis-c-1")
        .attr("transform", `translate(0,${height})`)
        .call(xAxis);

      xAxisGroup.append("text")
        .attr("x", width / 2)
        .attr("y", 45)
        .style("fill", "black")
        .style("text-anchor", "middle")
        .style("font-size", "12px")
        .style("font-weight", "bold")
        .text("Month");

      // Y-axis
      const yAxis = d3.axisLeft(yScale);
      const yAxisGroup = plot.append("g")
        .attr("id", "y-axis-c-1")
        .call(yAxis);

      yAxisGroup.append("text")
        .attr("transform", "rotate(-90)")
        .attr("y", -50)
        .attr("x", -height / 2)
        .style("text-anchor", "middle")
        .style("font-size", "12px")
        .style("font-weight", "bold")
        .text("Num of Ratings");

      // Legend
      const legendGroup = svg.append("g")
        .attr("id", "legend-c-1")
        .attr("transform", `translate(${margin.left + width + 40}, ${margin.top + 40})`);

      legendGroup.append("circle")
        .attr("cx", 0)
        .attr("cy", 0)
        .attr("r", 4)
        .style("fill", "#999")
        .style("stroke", "white")
        .style("stroke-width", 1.5);

      legendGroup.append("text")
        .attr("x", 15)
        .attr("y", 4)
        .style("font-size", "12px")
        .text("Ranking");
    }

    // ============ Q3.3-2: Log Scale ============
    function renderChartC2(games, data, colors, margin, width, height) {
      const svg = d3.select("body").append("svg")
        .attr("id", "svg-c-2")
        .attr("width", width + margin.left + margin.right + 120)
        .attr("height", height + margin.top + margin.bottom);

      // Title
      svg.append("text")
        .attr("id", "title-c-2")
        .attr("x", margin.left + width / 2)
        .attr("y", 15)
        .style("text-anchor", "middle")
        .style("font-size", "16px")
        .style("font-weight", "bold")
        .text("Number of Ratings 2016–2020 (Log Scale)");

      // Create plot group
      const plot = svg.append("g")
        .attr("id", "plot-c-2")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      // Create scales
      const xScale = d3.scaleTime()
        .domain(d3.extent(data, d => d.date))
        .range([0, width]);

      const yScale = d3.scaleLog()
        .domain([1, d3.max(games, game => d3.max(data, d => d[game]))])
        .range([height, 0]);

      // Create line generator
      const line = d3.line()
        .x(d => xScale(d.date))
        .y(d => yScale(d.value));

      // Lines group
      const linesGroup = plot.append("g").attr("id", "lines-c-2");

      // Draw lines for each game
      games.forEach((game, idx) => {
        const gameData = data.map(d => ({ date: d.date, value: d[game] }));

        linesGroup.append("path")
          .datum(gameData)
          .attr("class", "line")
          .attr("d", line)
          .style("stroke", colors[idx % 10]);

        // Add line label at end
        const lastPoint = gameData[gameData.length - 1];
        linesGroup.append("text")
          .attr("class", "line-label")
          .attr("x", xScale(lastPoint.date) + 5)
          .attr("y", yScale(lastPoint.value) + 3)
          .style("fill", colors[idx % 10])
          .text(game);
      });

      // Symbols group
      const symbolsGroup = plot.append("g").attr("id", "symbols-c-2");

      // Add circle markers every 3 months
      const threeMonthlyData = data.filter((d, i) => i % 3 === 0);

      games.forEach((game, idx) => {
        threeMonthlyData.forEach(d => {
          const value = d[game];
          const rank = d[game + "_rank"];

          symbolsGroup.append("circle")
            .attr("cx", xScale(d.date))
            .attr("cy", yScale(value))
            .attr("r", 4)
            .style("fill", colors[idx % 10])
            .style("stroke", "white")
            .style("stroke-width", 1.5);

          symbolsGroup.append("text")
            .attr("class", "rank-text")
            .attr("x", xScale(d.date))
            .attr("y", yScale(value))
            .attr("text-anchor", "middle")
            .attr("dominant-baseline", "middle")
            .style("fill", "white")
            .text(rank);
        });
      });

      // X-axis
      const xAxis = d3.axisBottom(xScale)
        .ticks(d3.timeMonth, 3)
        .tickFormat(d3.timeFormat("%b %y"));

      const xAxisGroup = plot.append("g")
        .attr("id", "x-axis-c-2")
        .attr("transform", `translate(0,${height})`)
        .call(xAxis);

      xAxisGroup.append("text")
        .attr("x", width / 2)
        .attr("y", 45)
        .style("fill", "black")
        .style("text-anchor", "middle")
        .style("font-size", "12px")
        .style("font-weight", "bold")
        .text("Month");

      // Y-axis
      const yAxis = d3.axisLeft(yScale);
      const yAxisGroup = plot.append("g")
        .attr("id", "y-axis-c-2")
        .call(yAxis);

      yAxisGroup.append("text")
        .attr("transform", "rotate(-90)")
        .attr("y", -50)
        .attr("x", -height / 2)
        .style("text-anchor", "middle")
        .style("font-size", "12px")
        .style("font-weight", "bold")
        .text("Num of Ratings");

      // Legend
      const legendGroup = svg.append("g")
        .attr("id", "legend-c-2")
        .attr("transform", `translate(${margin.left + width + 40}, ${margin.top + 40})`);

      legendGroup.append("circle")
        .attr("cx", 0)
        .attr("cy", 0)
        .attr("r", 4)
        .style("fill", "#999")
        .style("stroke", "white")
        .style("stroke-width", 1.5);

      legendGroup.append("text")
        .attr("x", 15)
        .attr("y", 4)
        .style("font-size", "12px")
        .text("Ranking");
    }
  </script>

  <div id="signature"></div>
</body>
</html>
