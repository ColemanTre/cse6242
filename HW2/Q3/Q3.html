<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q3: Board Game Ratings Line Chart</title>
  <script src="../lib/d3.v5.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f5f5f5;
    }
    svg {
      background-color: white;
      margin: 20px 0;
      border: 1px solid #ccc;
    }
    .axis {
      font-size: 12px;
    }
    .axis-label {
      font-size: 13px;
      font-weight: bold;
    }
    .line {
      fill: none;
      stroke-width: 2.5;
    }
    .line-label {
      font-size: 12px;
      font-weight: bold;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="chart-container"></div>
  
  <script>
    // Load and process data
    d3.csv("boardgame_ratings.csv").then(function(rawData) {
      // Parse the date format
      const parseDate = d3.timeParse("%Y-%m-%d");
      
      // Convert data
      const data = rawData.map(d => ({
        date: parseDate(d.date),
        "Catan": +d["Catan=count"],
        "Catan_rank": +d["Catan=rank"],
        "Dominion": +d["Dominion=count"],
        "Dominion_rank": +d["Dominion=rank"],
        "Codenames": +d["Codenames=count"],
        "Codenames_rank": +d["Codenames=rank"],
        "Terraforming Mars": +d["Terraforming Mars=count"],
        "Terraforming Mars_rank": +d["Terraforming Mars=rank"],
        "Gloomhaven": +d["Gloomhaven=count"],
        "Gloomhaven_rank": +d["Gloomhaven=rank"],
        "Magic: The Gathering": +d["Magic: The Gathering=count"],
        "Magic: The Gathering_rank": +d["Magic: The Gathering=rank"],
        "Dixit": +d["Dixit=count"],
        "Dixit_rank": +d["Dixit=rank"],
        "Monopoly": +d["Monopoly=count"],
        "Monopoly_rank": +d["Monopoly=rank"]
      }));

      // Configure chart
      const games = ["Catan", "Dominion", "Codenames", "Terraforming Mars", 
                     "Gloomhaven", "Magic: The Gathering", "Dixit", "Monopoly"];
      const games4 = ["Catan", "Codenames", "Terraforming Mars", "Gloomhaven"];
      const colors = d3.schemeCategory10;
      
      // Margins and dimensions
      const margin = { top: 60, right: 160, bottom: 60, left: 70 };
      const svgWidth = 1200;
      const svgHeight = 700;
      const width = svgWidth - margin.left - margin.right;
      const height = svgHeight - margin.top - margin.bottom;

      // Create first SVG
      const svg = d3.select("#chart-container")
        .append("svg")
        .attr("id", "svg-a")
        .attr("width", svgWidth)
        .attr("height", svgHeight);

      // Add chart title
      svg.append("text")
        .attr("id", "title-a")
        .attr("x", svgWidth / 2)
        .attr("y", 20)
        .attr("text-anchor", "middle")
        .style("font-size", "16px")
        .style("font-weight", "bold")
        .text("Number of Ratings 2016-2020");

      // Create group for margins
      const g = svg.append("g")
        .attr("id", "plot-a")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      // Create scales
      const xScale = d3.scaleTime()
        .domain(d3.extent(data, d => d.date))
        .range([0, width]);

      const yScale = d3.scaleLinear()
        .domain([0, d3.max(data, d => d3.max(games, game => d[game]))])
        .range([height, 0]);

      // Create line generator
      const line = d3.line()
        .x(d => xScale(d.date))
        .y(d => yScale(d.value));

      // Create lines group
      const linesGroup = g.append("g")
        .attr("id", "lines-a");

      // Draw lines for each game
      games.forEach((game, index) => {
        const color = colors[index % colors.length];
        
        // Prepare data for this game
        const gameData = data.map(d => ({
          date: d.date,
          value: d[game]
        })).filter(d => !isNaN(d.value));

        // Draw the line
        linesGroup.append("path")
          .datum(gameData)
          .attr("class", "line")
          .attr("d", line)
          .style("stroke", color);

        // Add label at the end of the line
        const lastPoint = gameData[gameData.length - 1];
        if (lastPoint) {
          linesGroup.append("text")
            .attr("class", "line-label")
            .attr("x", xScale(lastPoint.date) + 5)
            .attr("y", yScale(lastPoint.value) + 4)
            .style("fill", color)
            .text(game);
        }
      });

      // Add X-axis
      const xAxis = d3.axisBottom(xScale)
        .ticks(d3.timeMonth, 3)
        .tickFormat(d3.timeFormat("%b %y"));

      const xAxisGroup = g.append("g")
        .attr("id", "x-axis-a")
        .attr("class", "axis")
        .attr("transform", `translate(0,${height})`)
        .call(xAxis);

      // Add X-axis label
      xAxisGroup.append("text")
        .attr("class", "axis-label")
        .attr("x", width / 2)
        .attr("y", 45)
        .style("text-anchor", "middle")
        .style("fill", "black")
        .text("Month");

      // Add Y-axis
      const yAxis = d3.axisLeft(yScale);
      const yAxisGroup = g.append("g")
        .attr("id", "y-axis-a")
        .attr("class", "axis")
        .call(yAxis);

      // Add Y-axis label
      yAxisGroup.append("text")
        .attr("class", "axis-label")
        .attr("transform", "rotate(-90)")
        .attr("x", -height / 2)
        .attr("y", -50)
        .style("text-anchor", "middle")
        .style("fill", "black")
        .text("Num of Ratings");

      // ============ SECOND CHART: WITH RANKINGS ============
      const svg2 = d3.select("#chart-container")
        .append("svg")
        .attr("id", "svg-b")
        .attr("width", svgWidth)
        .attr("height", svgHeight);

      // Add chart title
      svg2.append("text")
        .attr("id", "title-b")
        .attr("x", svgWidth / 2)
        .attr("y", 20)
        .attr("text-anchor", "middle")
        .style("font-size", "16px")
        .style("font-weight", "bold")
        .text("Number of Ratings 2016–2020 with Rankings");

      // Create group for margins
      const g2 = svg2.append("g")
        .attr("id", "plot-b")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      // Create scales (same as first chart)
      const xScale2 = d3.scaleTime()
        .domain(d3.extent(data, d => d.date))
        .range([0, width]);

      const yScale2 = d3.scaleLinear()
        .domain([0, d3.max(data, d => d3.max(games, game => d[game]))])
        .range([height, 0]);

      // Create line generator
      const line2 = d3.line()
        .x(d => xScale2(d.date))
        .y(d => yScale2(d.value));

      // Create lines group
      const linesGroup2 = g2.append("g")
        .attr("id", "lines-b");

      // Draw lines for all 8 games
      games.forEach((game, index) => {
        const color = colors[index % colors.length];
        
        // Prepare data for this game
        const gameData = data.map(d => ({
          date: d.date,
          value: d[game]
        })).filter(d => !isNaN(d.value));

        // Draw the line
        linesGroup2.append("path")
          .datum(gameData)
          .attr("class", "line")
          .attr("d", line2)
          .style("stroke", color);

        // Add label in right margin (outside plot area to avoid circle overlap)
        const lastPoint = gameData[gameData.length - 1];
        if (lastPoint) {
          linesGroup2.append("text")
            .attr("class", "line-label")
            .attr("x", width + 15)
            .attr("y", yScale2(lastPoint.value) + 4)
            .style("fill", color)
            .text(game);
        }
      });

      // Add ranking circle markers for 4 games - every 3 months
      const symbolsGroup = g2.append("g")
        .attr("id", "symbols-b");
      
      // Filter for every 3-month interval aligned with x-axis ticks (indices 2, 5, 8, 11, etc.)
      const threeMonthlyData = data.filter((d, i) => i % 3 === 2);

      games4.forEach((game, idx) => {
        const gameIndex = games.indexOf(game);
        const color = colors[gameIndex % colors.length];
        
        threeMonthlyData.forEach(d => {
          const value = d[game];
          const rank = d[game + "_rank"];

          // Draw circle
          symbolsGroup.append("circle")
            .attr("cx", xScale2(d.date))
            .attr("cy", yScale2(value))
            .attr("r", 20)
            .style("fill", color)
            .style("stroke", "white")
            .style("stroke-width", 2);

          // Draw ranking text
          symbolsGroup.append("text")
            .attr("x", xScale2(d.date))
            .attr("y", yScale2(value))
            .attr("text-anchor", "middle")
            .attr("dominant-baseline", "middle")
            .style("fill", "white")
            .style("font-size", "10px")
            .style("font-weight", "bold")
            .text(rank);
        });
      });

      // Add X-axis
      const xAxis2 = d3.axisBottom(xScale2)
        .ticks(d3.timeMonth, 3)
        .tickFormat(d3.timeFormat("%b %y"));

      const xAxisGroup2 = g2.append("g")
        .attr("id", "x-axis-b")
        .attr("class", "axis")
        .attr("transform", `translate(0,${height})`)
        .call(xAxis2);

      // Add X-axis label
      xAxisGroup2.append("text")
        .attr("class", "axis-label")
        .attr("x", width / 2)
        .attr("y", 45)
        .style("text-anchor", "middle")
        .style("fill", "black")
        .text("Month");

      // Add Y-axis
      const yAxis2 = d3.axisLeft(yScale2);
      const yAxisGroup2 = g2.append("g")
        .attr("id", "y-axis-b")
        .attr("class", "axis")
        .call(yAxis2);

      // Add Y-axis label
      yAxisGroup2.append("text")
        .attr("class", "axis-label")
        .attr("transform", "rotate(-90)")
        .attr("x", -height / 2)
        .attr("y", -50)
        .style("text-anchor", "middle")
        .style("fill", "black")
        .text("Num of Ratings");

      // Add legend for ranking circles
      const legendGroup = svg2.append("g")
        .attr("id", "legend-b")
        .attr("transform", `translate(${svgWidth - 100}, ${svgHeight - 50})`);

      // Legend title
      legendGroup.append("text")
        .attr("x", 0)
        .attr("y", 15)
        .style("font-size", "12px")
        .style("font-weight", "bold")
        .style("text-anchor", "middle")
        .text("BoardGameGeek Rank");

      // Legend circle
      legendGroup.append("circle")
        .attr("cx", 0)
        .attr("cy", -15)
        .attr("r", 20)
        .style("fill", "#333")
        .style("stroke", "white")
        .style("stroke-width", 1.5);

      // Legend rank text inside circle
      legendGroup.append("text")
        .attr("x", 0)
        .attr("y", -12)
        .attr("text-anchor", "middle")
        .attr("dominant-baseline", "middle")
        .style("font-size", "10px")
        .style("font-weight", "bold")
        .style("fill", "white")
        .text("rank");

      // ============ THIRD CHART: SQUARE ROOT SCALE ============
      const svg3 = d3.select("#chart-container")
        .append("svg")
        .attr("id", "svg-c-1")
        .attr("width", svgWidth)
        .attr("height", svgHeight);

      // Add chart title
      svg3.append("text")
        .attr("id", "title-c-1")
        .attr("x", svgWidth / 2)
        .attr("y", 20)
        .attr("text-anchor", "middle")
        .style("font-size", "16px")
        .style("font-weight", "bold")
        .text("Number of Ratings 2016–2020 (Square root Scale)");

      // Create group for margins
      const g3 = svg3.append("g")
        .attr("id", "plot-c-1")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      // Create scales (square root for y-axis)
      const xScale3 = d3.scaleTime()
        .domain(d3.extent(data, d => d.date))
        .range([0, width]);

      const yScale3 = d3.scaleSqrt()
        .domain([0, d3.max(data, d => d3.max(games, game => d[game]))])
        .range([height, 0]);

      // Create line generator
      const line3 = d3.line()
        .x(d => xScale3(d.date))
        .y(d => yScale3(d.value));

      // Create lines group
      const linesGroup3 = g3.append("g")
        .attr("id", "lines-c-1");

      // Draw lines for all 8 games
      games.forEach((game, index) => {
        const color = colors[index % colors.length];
        
        // Prepare data for this game
        const gameData = data.map(d => ({
          date: d.date,
          value: d[game]
        })).filter(d => !isNaN(d.value));

        // Draw the line
        linesGroup3.append("path")
          .datum(gameData)
          .attr("class", "line")
          .attr("d", line3)
          .style("stroke", color);

        // Add label in right margin
        const lastPoint = gameData[gameData.length - 1];
        if (lastPoint) {
          linesGroup3.append("text")
            .attr("class", "line-label")
            .attr("x", width + 15)
            .attr("y", yScale3(lastPoint.value) + 4)
            .style("fill", color)
            .text(game);
        }
      });

      // Add ranking circle markers for 4 games
      const symbolsGroup3 = g3.append("g")
        .attr("id", "symbols-c-1");
      
      threeMonthlyData.forEach(d => {
        games4.forEach((game, idx) => {
          const gameIndex = games.indexOf(game);
          const color = colors[gameIndex % colors.length];
          const value = d[game];
          const rank = d[game + "_rank"];

          // Draw circle
          symbolsGroup3.append("circle")
            .attr("cx", xScale3(d.date))
            .attr("cy", yScale3(value))
            .attr("r", 20)
            .style("fill", color)
            .style("stroke", "white")
            .style("stroke-width", 2);

          // Draw ranking text
          symbolsGroup3.append("text")
            .attr("x", xScale3(d.date))
            .attr("y", yScale3(value))
            .attr("text-anchor", "middle")
            .attr("dominant-baseline", "middle")
            .style("fill", "white")
            .style("font-size", "10px")
            .style("font-weight", "bold")
            .text(rank);
        });
      });

      // Add X-axis
      const xAxis3 = d3.axisBottom(xScale3)
        .ticks(d3.timeMonth, 3)
        .tickFormat(d3.timeFormat("%b %y"));

      const xAxisGroup3 = g3.append("g")
        .attr("id", "x-axis-c-1")
        .attr("class", "axis")
        .attr("transform", `translate(0,${height})`)
        .call(xAxis3);

      // Add X-axis label
      xAxisGroup3.append("text")
        .attr("class", "axis-label")
        .attr("x", width / 2)
        .attr("y", 45)
        .style("text-anchor", "middle")
        .style("fill", "black")
        .text("Month");

      // Add Y-axis
      const yAxis3 = d3.axisLeft(yScale3);
      const yAxisGroup3 = g3.append("g")
        .attr("id", "y-axis-c-1")
        .attr("class", "axis")
        .call(yAxis3);

      // Add Y-axis label
      yAxisGroup3.append("text")
        .attr("class", "axis-label")
        .attr("transform", "rotate(-90)")
        .attr("x", -height / 2)
        .attr("y", -50)
        .style("text-anchor", "middle")
        .style("fill", "black")
        .text("Num of Ratings");

      // Add legend for ranking circles
      const legendGroup3 = svg3.append("g")
        .attr("id", "legend-c-1")
        .attr("transform", `translate(${svgWidth - 100}, ${svgHeight - 50})`);

      // Legend title
      legendGroup3.append("text")
        .attr("x", 0)
        .attr("y", 15)
        .style("font-size", "12px")
        .style("font-weight", "bold")
        .style("text-anchor", "middle")
        .text("BoardGameGeek Rank");

      // Legend circle
      legendGroup3.append("circle")
        .attr("cx", 0)
        .attr("cy", -15)
        .attr("r", 20)
        .style("fill", "#333")
        .style("stroke", "white")
        .style("stroke-width", 1.5);

      // Legend rank text inside circle
      legendGroup3.append("text")
        .attr("x", 0)
        .attr("y", -12)
        .attr("text-anchor", "middle")
        .attr("dominant-baseline", "middle")
        .style("font-size", "10px")
        .style("font-weight", "bold")
        .style("fill", "white")
        .text("rank");

      // ============ FOURTH CHART: LOG SCALE ============
      const svg4 = d3.select("#chart-container")
        .append("svg")
        .attr("id", "svg-c-2")
        .attr("width", svgWidth)
        .attr("height", svgHeight);

      // Add chart title
      svg4.append("text")
        .attr("id", "title-c-2")
        .attr("x", svgWidth / 2)
        .attr("y", 20)
        .attr("text-anchor", "middle")
        .style("font-size", "16px")
        .style("font-weight", "bold")
        .text("Number of Ratings 2016–2020 (Log Scale)");

      // Create group for margins
      const g4 = svg4.append("g")
        .attr("id", "plot-c-2")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      // Create scales (log for y-axis with domain min of 1)
      const xScale4 = d3.scaleTime()
        .domain(d3.extent(data, d => d.date))
        .range([0, width]);

      const yScale4 = d3.scaleLog()
        .domain([1, d3.max(data, d => d3.max(games, game => d[game]))])
        .range([height, 0]);

      // Create line generator
      const line4 = d3.line()
        .x(d => xScale4(d.date))
        .y(d => yScale4(d.value));

      // Create lines group
      const linesGroup4 = g4.append("g")
        .attr("id", "lines-c-2");

      // Draw lines for all 8 games
      games.forEach((game, index) => {
        const color = colors[index % colors.length];
        
        // Prepare data for this game
        const gameData = data.map(d => ({
          date: d.date,
          value: d[game]
        })).filter(d => !isNaN(d.value));

        // Draw the line
        linesGroup4.append("path")
          .datum(gameData)
          .attr("class", "line")
          .attr("d", line4)
          .style("stroke", color);

        // Add label in right margin
        const lastPoint = gameData[gameData.length - 1];
        if (lastPoint) {
          linesGroup4.append("text")
            .attr("class", "line-label")
            .attr("x", width + 15)
            .attr("y", yScale4(lastPoint.value) + 4)
            .style("fill", color)
            .text(game);
        }
      });

      // Add ranking circle markers for 4 games
      const symbolsGroup4 = g4.append("g")
        .attr("id", "symbols-c-2");
      
      threeMonthlyData.forEach(d => {
        games4.forEach((game, idx) => {
          const gameIndex = games.indexOf(game);
          const color = colors[gameIndex % colors.length];
          const value = d[game];
          const rank = d[game + "_rank"];

          // Draw circle
          symbolsGroup4.append("circle")
            .attr("cx", xScale4(d.date))
            .attr("cy", yScale4(value))
            .attr("r", 20)
            .style("fill", color)
            .style("stroke", "white")
            .style("stroke-width", 2);

          // Draw ranking text
          symbolsGroup4.append("text")
            .attr("x", xScale4(d.date))
            .attr("y", yScale4(value))
            .attr("text-anchor", "middle")
            .attr("dominant-baseline", "middle")
            .style("fill", "white")
            .style("font-size", "10px")
            .style("font-weight", "bold")
            .text(rank);
        });
      });

      // Add X-axis
      const xAxis4 = d3.axisBottom(xScale4)
        .ticks(d3.timeMonth, 3)
        .tickFormat(d3.timeFormat("%b %y"));

      const xAxisGroup4 = g4.append("g")
        .attr("id", "x-axis-c-2")
        .attr("class", "axis")
        .attr("transform", `translate(0,${height})`)
        .call(xAxis4);

      // Add X-axis label
      xAxisGroup4.append("text")
        .attr("class", "axis-label")
        .attr("x", width / 2)
        .attr("y", 45)
        .style("text-anchor", "middle")
        .style("fill", "black")
        .text("Month");

      // Add Y-axis
      const yAxis4 = d3.axisLeft(yScale4);
      const yAxisGroup4 = g4.append("g")
        .attr("id", "y-axis-c-2")
        .attr("class", "axis")
        .call(yAxis4);

      // Add Y-axis label
      yAxisGroup4.append("text")
        .attr("class", "axis-label")
        .attr("transform", "rotate(-90)")
        .attr("x", -height / 2)
        .attr("y", -50)
        .style("text-anchor", "middle")
        .style("fill", "black")
        .text("Num of Ratings");

      // Add legend for ranking circles
      const legendGroup4 = svg4.append("g")
        .attr("id", "legend-c-2")
        .attr("transform", `translate(${svgWidth - 100}, ${svgHeight - 50})`);

      // Legend title
      legendGroup4.append("text")
        .attr("x", 0)
        .attr("y", 15)
        .style("font-size", "12px")
        .style("font-weight", "bold")
        .style("text-anchor", "middle")
        .text("BoardGameGeek Rank");

      // Legend circle
      legendGroup4.append("circle")
        .attr("cx", 0)
        .attr("cy", -15)
        .attr("r", 20)
        .style("fill", "#333")
        .style("stroke", "white")
        .style("stroke-width", 1.5);

      // Legend rank text inside circle
      legendGroup4.append("text")
        .attr("x", 0)
        .attr("y", -12)
        .attr("text-anchor", "middle")
        .attr("dominant-baseline", "middle")
        .style("font-size", "10px")
        .style("font-weight", "bold")
        .style("fill", "white")
        .text("rank");

      // Add GT username to bottom right
      svg4.append("text")
        .attr("x", svgWidth - 10)
        .attr("y", svgHeight - 10)
        .style("font-size", "12px")
        .style("text-anchor", "end")
        .text("ctreadwell8");

    }).catch(error => console.error("Error loading data:", error));
  </script>

  <div id="ctreadwell8"></div>
</body>
</html>
